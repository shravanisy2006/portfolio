<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page not found | Shravani Yalagatti</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <style>
      :root { --bg:#0b0f14; --text:#e6edf3; --muted:#9aa7b4; --accent:#2dd4bf; --border:#233040; }
      @media (prefers-color-scheme: light) { :root { --bg:#f7fafa; --text:#0e1a1f; --muted:#4b5b63; --accent:#0f766e; --border:#d5e0e0; } }
      * { box-sizing: border-box; }
      body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; background:var(--bg); color:var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background-image: radial-gradient(color-mix(in oklab, var(--muted) 30%, transparent) 1px, transparent 1px); background-size: 26px 26px; }
      main { text-align:center; max-width:520px; }
      .code { font-size: clamp(96px, 22vw, 168px); font-weight:800; line-height:1; letter-spacing:-4px; color:transparent;
        -webkit-text-stroke: 2px var(--accent); margin:0; }
      p.mono { font-family: ui-monospace, "Cascadia Code", monospace; color:var(--accent); margin:24px 0 0; }
      h1 { font-size: 28px; margin: 8px 0 0; }
      p.muted { color: var(--muted); line-height: 1.6; }
      a { display:inline-block; margin-top:20px; padding:14px 24px; border-radius:999px; background:var(--accent); color:var(--bg);
        font-weight:600; text-decoration:none; }
      a:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    </style>
  </head>
  <body>
    <main>
      <p class="code" aria-hidden="true">404</p>
      <p class="mono">// signal lost</p>
      <h1>This page doesn't exist</h1>
      <p class="muted">The link may be broken, or the page may have moved.</p>
      <a href="/">Back to the portfolio</a>
    </main>
  </body>
</html>
